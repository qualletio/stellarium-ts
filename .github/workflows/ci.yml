name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Compile contracts and check size
        run: pnpm contracts:build

      - name: Typecheck implementation and tests
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify protocol vectors
        run: pnpm vectors:check

      - name: Contract tests
        run: pnpm contracts:test

      - name: Local deployment plan
        run: pnpm deploy:plan

      - name: Test
        run: pnpm test
