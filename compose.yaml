services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stellarium
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: stellarium
    # volumes:
    #   - postgres-data:/var/lib/postgresql/data
    #   - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-receipts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellarium -d stellarium"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  operator:
    build:
      context: .
      target: operator
    environment:
      DATABASE_URL: postgresql://stellarium:local-only-password@postgres:5432/stellarium
      # Enrolls the fixture nodes' keys (set in the repo root .env, matching each app's .env) in two seed
      # organizations and credits the caller. Set SEED_DEV=0 in the root .env to enroll them from the dashboard instead.
      SEED_DEV: ${SEED_DEV:-1}
      SEED_PROVIDER_PUBLIC_KEY: ${PROVIDER_SIGNING_PUBLIC_KEY:-}
      SEED_CALLER_PUBLIC_KEY: ${CALLER_SIGNING_PUBLIC_KEY:-}
      # Lists the provider's node and gives the caller's organization an API client for it (cli_local_caller). Local only.
      SEED_PROVIDER_BASE_URL: http://local-resource-node:3002
      SEED_CLIENT_SECRET: cs_local-only-client-secret
      # Signs dashboard session cookies. Local only: production needs its own secret.
      BETTER_AUTH_SECRET: local-only-better-auth-secret-0123456789
      # Signs API clients' run tokens (an Ed25519 PKCS#8 key, base64url). Local only: production needs its own key.
      RUN_TOKEN_PRIVATE_KEY: MC4CAQAwBQYDK2VwBCIEIF3fP6TT6BvfrSEi_gSWQ0bRJ9iHucuxcV-XRxMeQC7O
      # Shared with the dashboard's server, which sends it with the Composer turns it charges for. Local only.
      DASHBOARD_SERVICE_SECRET: local-only-dashboard-secret
      # Stripe keys, RESEND_API_KEY/EMAIL_FROM and GitHub OAuth credentials are optional and come from apps/operator/.env,
      # which the image includes like the nodes' .env files. Setting them here, even empty, would shadow that file.
      # Without RESEND_API_KEY, verification and invitation links are in `docker compose logs operator`.
      DASHBOARD_URL: http://localhost:3010
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck.mjs", "3001"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  local-resource-node:
    build:
      context: .
      target: local-resource-node
    environment:
      PORT: "3002"
      BASE_URL: http://local-resource-node:3002
      OPERATOR_URL: http://operator:3001/v1
      # Postgres instead of a SQLite file, in its own schema of the operator's database. The caller node stays on SQLite.
      DATABASE_URL: postgresql://stellarium:local-only-password@postgres:5432/stellarium
      DATABASE_SCHEMA: resource_node
      # Another organization pays $0.001 to deploy a contract here.
      CONTRACT_DEPLOY_FEE_MICRO_USD: "1000"
    ports:
      - "127.0.0.1:3002:3002"
    # Hosting paid functions, it learns its organization from the operator at startup.
    depends_on:
      operator:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck.mjs", "3002"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s

  local-caller-node:
    build:
      context: .
      target: local-caller-node
    environment:
      PORT: "3003"
      BASE_URL: http://local-caller-node:3003
      STARTING_PEER: http://local-resource-node:3002
      OPERATOR_URL: http://operator:3001/v1
      # Enough for a contract's tokens and the paid calls it makes, up to $0.05.
      CONTRACT_COST_LIMIT_MICRO_USD: "50000"
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      local-resource-node:
        condition: service_healthy
    init: true

