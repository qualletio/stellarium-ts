services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stellarium
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: stellarium
    # volumes:
    #   - postgres-data:/var/lib/postgresql/data
    #   - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-receipts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellarium -d stellarium"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  operator:
    build:
      context: .
      target: operator
    environment:
      DATABASE_URL: postgresql://stellarium:local-only-password@postgres:5432/stellarium
      # Enrolls the fixture nodes' keys (set in the repo root .env, matching each app's .env) and credits the caller.
      SEED_DEV: "1"
      SEED_PROVIDER_PUBLIC_KEY: ${PROVIDER_SIGNING_PUBLIC_KEY:?set PROVIDER_SIGNING_PUBLIC_KEY in .env}
      SEED_CALLER_PUBLIC_KEY: ${CALLER_SIGNING_PUBLIC_KEY:?set CALLER_SIGNING_PUBLIC_KEY in .env}
      # Optional. Without Stripe keys, top-ups and payouts are off and balances come from the seed;
      # without Clerk keys, the dashboard API is off. Use Stripe test-mode keys locally.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck.mjs", "3001"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  local-resource-node:
    build:
      context: .
      target: local-resource-node
    environment:
      PORT: "3002"
      BASE_URL: http://local-resource-node:3002
      OPERATOR_URL: http://operator:3001/v1
    ports:
      - "127.0.0.1:3002:3002"
    # Hosting paid functions, it learns its organization from the operator at startup.
    depends_on:
      operator:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck.mjs", "3002"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s

  local-caller-node:
    build:
      context: .
      target: local-caller-node
    environment:
      PORT: "3003"
      BASE_URL: http://local-caller-node:3003
      STARTING_PEER: http://local-resource-node:3002
      OPERATOR_URL: http://operator:3001/v1
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      local-resource-node:
        condition: service_healthy
    init: true

