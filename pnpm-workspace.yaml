packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sqlite3: true
  bufferutil: false
  utf-8-validate: false
  # Native addon for @solana/spl-token's bigint conversion; the pure JS fallback is used instead.
  bigint-buffer: false

onlyBuiltDependencies:
  - esbuild
  - sqlite3

minimumReleaseAge: 0

permissions:
  drizzle-kit:
    skills: true
